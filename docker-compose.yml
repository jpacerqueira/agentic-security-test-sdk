services:
  agentic-security:
    build: .
    ports:
      - "8090:8090"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      SKIP_LLM: ${SKIP_LLM:-true}
      # Ollama on the host — OpenAI-compatible /v1 (chat.completions + models).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_ENGINE: ${LLM_ENGINE:-ollama}
      MODEL_REASONING: ${MODEL_REASONING:-gemma4:latest}
      MODEL_FAST: ${MODEL_FAST:-gemma4:latest}
      MODEL_CONTEXT_LENGTH: ${MODEL_CONTEXT_LENGTH:-131072}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_READY_TIMEOUT_SECONDS: ${LLM_READY_TIMEOUT_SECONDS:-120}
      RUNS_DIR: /app/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./examples:/app/examples
      - ./runs:/app/runs
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
