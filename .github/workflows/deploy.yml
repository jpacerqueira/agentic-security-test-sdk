name: Deploy image

on:
  workflow_dispatch:
    inputs:
      showcase:
        description: Which deployment to publish
        required: true
        type: choice
        options:
          - google-cloud-showcase
          - langgraph-showcase

concurrency:
  group: deploy-${{ inputs.showcase }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test ${{ inputs.showcase }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.showcase }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - name: Build the app image
        run: docker compose build agentic-security

      - name: Run the suite inside the image
        run: docker compose run --no-deps --rm -e SKIP_LLM=true agentic-security pytest -q --tb=line -W error::DeprecationWarning

  publish:
    name: Publish ${{ inputs.showcase }}
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.showcase }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the app image
        run: docker compose build agentic-security

      - name: Tag and push one image
        run: |
          local_image="${{ inputs.showcase }}-agentic-security:latest"
          remote="ghcr.io/${{ github.repository }}:${{ inputs.showcase }}"
          docker tag "$local_image" "$remote"
          docker tag "$local_image" "${remote}-${{ github.sha }}"
          docker push "$remote"
          docker push "${remote}-${{ github.sha }}"
