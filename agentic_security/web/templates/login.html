{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block body %}
<section class="demo-hero">
  <p class="classification">Trust management · pentest pipeline</p>
  <h1>Sign in</h1>
  <p class="lede">Same session cookie model as Micro-Cosmos. Default local credentials are in <code>.env.example</code>.</p>
  {% if error %}<p class="warn">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="demo-form" style="max-width:360px">
    <label>Username <input name="username" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Enter</button>
  </form>
</section>
{% endblock %}
