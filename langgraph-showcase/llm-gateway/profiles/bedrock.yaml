# DORMANT until LLM_PROFILE=bedrock. Needs AWS credentials in the gateway env.
# Alias gemma4:latest → BEDROCK_LITELLM_MODEL. No silent failover from Ollama.

model_list:
  - model_name: gemma4:latest
    litellm_params:
      model: os.environ/BEDROCK_LITELLM_MODEL
      aws_region_name: os.environ/AWS_REGION
      timeout: 360
  - model_name: openai/gemma4:latest
    litellm_params:
      model: os.environ/BEDROCK_LITELLM_MODEL
      aws_region_name: os.environ/AWS_REGION
      timeout: 360

litellm_settings:
  drop_params: true
  request_timeout: 360
  json_logs: true
  set_verbose: true
  callbacks: custom_callbacks.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
